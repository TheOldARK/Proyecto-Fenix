name: Publicar Fénix 3.0.3 multiplataforma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Compilar y diagnosticar
        shell: pwsh
        run: .\construir_windows.ps1
      - name: Mostrar diagnóstico si falla Windows
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .venv-distribucion -Recurse -File -Filter diagnostico_instalacion.json -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content -LiteralPath $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-windows
          path: |
            dist/Fenix-3.0.3-windows-x64.zip
            dist/Fenix-3.0.3-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m playwright install --only-shell chromium
      - run: python -B -m unittest discover -s tests
      - run: python -B herramientas/construir_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-macos-${{ matrix.arch }}
          path: |
            dist/macos/Fenix-3.0.3-macos-*.zip
            dist/macos/Fenix-3.0.3-macos-*.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      QT_QPA_PLATFORM: xcb
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-shape0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libegl1 libwayland-server0 libopengl0 libgl1
      - run: xvfb-run -a python -B -m unittest discover -s tests
      - run: xvfb-run -a python -B herramientas/construir_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-linux
          path: |
            dist/linux/Fenix-3.0.3-linux-x64.tar.gz
            dist/linux/Fenix-3.0.3-linux-x64.tar.gz.sha256
          if-no-files-found: error

  publicar:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: paquete-*
          path: paquetes
          merge-multiple: true
      - name: Comprobar todos los paquetes antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          cd paquetes
          test -s Fenix-3.0.3-windows-x64.zip
          test -s Fenix-3.0.3-windows-x64-setup.exe
          test -s Fenix-3.0.3-macos-arm64.zip
          test -s Fenix-3.0.3-macos-x64.zip
          test -s Fenix-3.0.3-linux-x64.tar.gz
          sha256sum -c Fenix-3.0.3-macos-arm64.zip.sha256
          sha256sum -c Fenix-3.0.3-macos-x64.zip.sha256
          sha256sum -c Fenix-3.0.3-linux-x64.tar.gz.sha256
      - name: Crear release completa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v3.0.3 paquetes/Fenix-3.0.3-* \
            --title 'Fénix 3.0.3' --notes-file <(sed -n '/^# Fénix 3.0.3$/,/^# Fénix 3.0.2$/p' ACTUALIZACIONES.md | sed '$d;1d') \
            --draft --target "${GITHUB_SHA}"
          gh release edit v3.0.3 --draft=false --latest
