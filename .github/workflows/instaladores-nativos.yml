name: Instaladores nativos de prueba (sin publicar)

on:
  workflow_dispatch:
  push:
    branches: [instaladores-nativos]

permissions:
  contents: read

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            plataforma: macos-arm64
            arquitectura: arm64
          - os: macos-15-intel
            plataforma: macos-x64
            arquitectura: x64
          - os: ubuntu-22.04
            plataforma: linux-x64
            arquitectura: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arquitectura }}
      - name: Dependencias del instalador (sin Chromium ni Fénix)
        run: python -m pip install PySide6-Essentials==6.11.2 shiboken6==6.11.2 pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7 certifi==2025.11.12 pillow==12.3.0
      - name: Bibliotecas del sistema Linux para probar la app descargada
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxcb-shape0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libwayland-server0 libopengl0 libgl1 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2
      - name: Pruebas de seguridad, cancelación y recuperación
        run: python -B -m unittest discover -s tests -p test_instalador_nativo.py
      - name: Compilar el instalador nativo
        run: python -B herramientas/construir_instalador_nativo.py
      - name: Prueba gráfica con descarga real en Mac
        if: runner.os == 'macOS'
        run: python -B herramientas/probar_instalador_nativo.py
      - name: Prueba gráfica con descarga real en Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=xcb xvfb-run -a python -B herramientas/probar_instalador_nativo.py
      - name: Guardar instalador de prueba (no es una release)
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-${{ matrix.plataforma }}
          path: |
            dist/instalador-nativo/Fenix-Instalador-*.zip
            dist/instalador-nativo/Fenix-Instalador-*.tar.gz
            dist/instalador-nativo/Fenix-Instalador-*.sha256
            LEEME_INSTALADORES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Guardar diagnóstico y captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pruebas-instalador-${{ matrix.plataforma }}
          path: build/pruebas-instalador/
          if-no-files-found: ignore
          retention-days: 14
