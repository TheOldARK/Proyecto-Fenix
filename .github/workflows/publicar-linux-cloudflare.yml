name: Publicar corrección Cloudflare Linux

on:
  push:
    branches: [linux-cloudflare-hotfix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      QT_QPA_PLATFORM: xcb
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de compilación
        run: |
          python -m pip install -r requirements-build.txt
          python -m playwright install --with-deps --only-shell chromium
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-shape0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libegl1 libwayland-server0 libopengl0 libgl1
      - name: Probar descarga de Cloudflare y seguridad del cliente
        run: |
          xvfb-run -a python -B -m unittest tests.test_datos_cloudflare_libres_opcionales tests.test_paquete_cliente tests.test_instalador_nativo
      - name: Construir cliente Linux y verificar paquete extraído
        run: xvfb-run -a python -B herramientas/construir_linux.py
      - name: Construir instalador Linux
        run: python -B herramientas/construir_instalador_nativo.py
      - name: Verificar paquetes antes de publicar
        run: |
          cd dist/linux
          sha256sum -c Fenix-2.1.1-linux-x64.tar.gz.sha256
          cd ../instalador-nativo
          sha256sum -c Fenix-Instalador-linux-x64.tar.gz.sha256
          tar -tzf Fenix-Instalador-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Fenix-linux-cloudflare-verificado
          path: |
            dist/linux/Fenix-2.1.1-linux-x64.tar.gz
            dist/linux/Fenix-2.1.1-linux-x64.tar.gz.sha256
            dist/instalador-nativo/Fenix-Instalador-linux-x64.tar.gz
            dist/instalador-nativo/Fenix-Instalador-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fenix-linux-cloudflare-verificado
          path: paquetes
      - name: Verificar y respaldar archivos actuales
        run: |
          set -euo pipefail
          cd paquetes
          (cd dist/linux && sha256sum -c Fenix-2.1.1-linux-x64.tar.gz.sha256)
          (cd dist/instalador-nativo && sha256sum -c Fenix-Instalador-linux-x64.tar.gz.sha256)
          mkdir -p respaldo
          for nombre in Fenix-2.1.1-linux-x64.tar.gz Fenix-2.1.1-linux-x64.tar.gz.sha256 Fenix-Instalador-linux-x64.tar.gz Fenix-Instalador-linux-x64.tar.gz.sha256; do
            gh release download v2.1.1 --repo "$GITHUB_REPOSITORY" --pattern "$nombre" --dir respaldo
            test -s "respaldo/$nombre"
          done
      - name: Reemplazar cliente e instalador con recuperación ante fallos
        run: |
          set -euo pipefail
          cd paquetes
          for ruta in \
            dist/linux/Fenix-2.1.1-linux-x64.tar.gz \
            dist/linux/Fenix-2.1.1-linux-x64.tar.gz.sha256 \
            dist/instalador-nativo/Fenix-Instalador-linux-x64.tar.gz \
            dist/instalador-nativo/Fenix-Instalador-linux-x64.tar.gz.sha256; do
            nombre="$(basename "$ruta")"
            if ! gh release upload v2.1.1 "$ruta" --repo "$GITHUB_REPOSITORY" --clobber; then
              gh release upload v2.1.1 "respaldo/$nombre" --repo "$GITHUB_REPOSITORY" --clobber
              exit 1
            fi
          done
          gh release view v2.1.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
