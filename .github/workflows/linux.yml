name: Fenix para Linux

on:
  workflow_dispatch:
  push:
    branches: [linux-2.1.1]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      QT_QPA_PLATFORM: xcb
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias nativas
        run: |
          python -m pip install -r requirements-build.txt
          python -m playwright install --with-deps --only-shell chromium
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libopengl0 libgl1
      - name: Pruebas
        run: xvfb-run -a python -B -m unittest discover -s tests
      - name: Compilar y probar el paquete extraído
        run: xvfb-run -a python -B herramientas/construir_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fenix-linux-x64
          path: |
            dist/linux/Fenix-*-linux-x64.tar.gz
            dist/linux/Fenix-*-linux-x64.tar.gz.sha256
            LEEME_LINUX.txt
          if-no-files-found: error
          retention-days: 30
      - name: Guardar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-linux-22.04
          path: build/linux/diagnostico*.json
          if-no-files-found: ignore

  verificar_ubuntu_24:
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Fenix-linux-x64
          path: paquete
      - name: Dependencias de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libegl1 libopengl0 libgl1 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2
      - name: Ejecutar el paquete en un segundo sistema sin instalar Python ni Playwright
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          cd paquete/dist/linux
          sha256sum -c Fenix-*.sha256
          tar -xzf Fenix-*-linux-x64.tar.gz
          export FENIX_DATA_DIR="$RUNNER_TEMP/fenix-verificacion"
          xvfb-run -a ./Fenix/Fenix --diagnostico
          cat "$FENIX_DATA_DIR/logs/diagnostico_instalacion.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-linux-24.04
          path: ${{ runner.temp }}/fenix-verificacion/logs/diagnostico_instalacion.json
          if-no-files-found: ignore
